services:
  php:
    build:
      context: .
      target: runtime
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    volumes:
      - type: bind
        source: .
        target: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - lrv

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - 80:80
    depends_on:
      php:
        condition: service_started
    volumes:
      - type: bind
        source: .
        target: /var/www/html
        read_only: true
    networks:
      - lrv

  db:
    image: mariadb:12.3
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lrv
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
volumes:
  db_data:

networks:
  lrv:
    driver: bridge
