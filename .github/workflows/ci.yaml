name: Desi Laravel website CI

on:
  pull_request:
    branches:
      - main

permissions:
  content: read

jobs:
  quality:
    name: PHPStan & PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick, mbstring, bcmath, intl, pdo_mysql, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: php artisan test

  docker:
    name: Validate production images
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: PHP Production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: laravel-php:ci

      - name: Nginx Production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: false
          tags: laravel-nginx:ci


