services:
    desi.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.3/app
        container_name: 'desi_main'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail-desi

    mariadb:
        image: 'mariadb:11'
        container_name: 'desi_db'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sail-mariadb-desi:/var/lib/mysql'
            - './.dockerfiles/create-testing-database-mariadb.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail-desi
        healthcheck:
            test: [ "CMD", "mariadb-admin", "ping", "-p${DB_PASSWORD}" ]
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: 'desi_mailpit'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail-desi

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: 'desi_phpmyadmin'
        ports:
            - 8081:80
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            PMA_HOST: mysql
        links:
            - "mariadb:mysql"
        depends_on:
            - mariadb
        networks:
            - sail-desi

networks:
    sail-desi:
        driver: bridge
volumes:
    sail-mariadb-desi:
